name: Motionary
options:
  bundleIdPrefix: com.caden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: ZRUFVD5GDT
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Motionary:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
        # The app and the extension used to carry identical copies of all of
        # this - 253MB of the 507MB archive was the same files twice.
        #
        # The baked icons and skins now ship in the extension alone and the app
        # reads them back out of its own PlugIns folder, which is a
        # subdirectory of itself rather than anything sandboxed away. The lane
        # fonts it simply does not need: the in-app preview plays the rendered
        # video, and nothing in App/ draws the lane stack or names a lane font.
        excludes:
          - "prebuilt-icon-*.png"
          - "prebuilt-skin-*.png"
          - "MFont*.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.Motionary
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Motionary.entitlements
        # Without this the Home Screen shows a blank placeholder and App Store
        # Connect refuses the build outright.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Lets the FONT_EMBED_PROBE build still link if a future SDK stops
        # exporting the two private `_wantsCustomFontsEmbeddedInArchive`
        # accessors. It does NOT make a found symbol weak - the reference stays
        # strong and two-level - which is why the shim is behind a compile flag
        # rather than shipped. See Shared/WidgetArchiveFontEmbedding.swift.
        OTHER_LDFLAGS:
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvg"
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvs"
    dependencies:
      - target: MotionaryWidgetExtension
    scheme:
      testTargets: [MotionaryTests, MotionaryUITests]

  MotionaryWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      # The blink font drives which lane is visible; the shaping template is
      # bundled here too so the extension can be diagnosed on its own.
      - path: Resources
        buildPhase: resources
        # The other half of the split described on the app target. The
        # extension never plays a video and never reads the tile-free
        # wallpaper: it draws frames, and falls back to `-wallpaper.png` only
        # when a design shipped without a baked backdrop, so that one stays.
        excludes:
          - "prebuilt-*-preview.mp4"
          - "prebuilt-*-preview-*.mp4"
          - "prebuilt-*-wallpaper-plain.png"
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.Motionary.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/MotionaryWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Lets the FONT_EMBED_PROBE build still link if a future SDK stops
        # exporting the two private `_wantsCustomFontsEmbeddedInArchive`
        # accessors. It does NOT make a found symbol weak - the reference stays
        # strong and two-level - which is why the shim is behind a compile flag
        # rather than shipped. See Shared/WidgetArchiveFontEmbedding.swift.
        OTHER_LDFLAGS:
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvg"
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvs"

  MotionaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      # The studio's bundling step decides whether a design reaches the widget
      # at all, and it is plain Foundation, so it is covered here rather than
      # needing a second test target.
      - path: Mac/Install/BundleWriter.swift
      # A locked phone is reported as "exited 70" under a wall of build
      # settings, and turning that into something actionable is plain string
      # work - the installer around it shells out and cannot be tested.
      - path: Mac/Install/InstallerHints.swift
      # What the run screen claims a long job is doing. Plain Foundation on
      # purpose, so the step mapping is covered rather than only looked at.
      - path: Mac/Studio/StudioRunPlan.swift
      - path: Mac/Library/SkinLibrary.swift
      # The way back after the window is closed. Snapshot policy and pruning
      # are plain Foundation, and getting either wrong loses work silently.
      - path: Mac/Library/DesignVersions.swift
      # Applying a set decides what a slot can show on the phone, so the pure
      # apply rules are covered with the rest of the tile logic.
      - path: Mac/Library/SkinSets.swift
      # A names table that parses to the wrong shape pairs every icon in a
      # sheet with the wrong label, and nothing about that looks wrong.
      - path: Mac/Library/SpriteSheet.swift
      # Undo is snapshots with hand-rolled redo bookkeeping, which is exactly
      # the kind of state machine that breaks quietly.
      - path: Mac/Studio/UndoCoordinator.swift
      # Alignment decides where a row of launchers actually lands, and it is
      # pure geometry, so it is covered here rather than by eye on a canvas.
      - path: Mac/Studio/LayoutActions.swift
      # Resolving a tile's artwork decides what the wallpaper bakes as well as
      # what the bundle installs, so it belongs to the same coverage.
      - path: Mac/Library/TileArtwork.swift
      # Sampling a key colour flips between image and context coordinates, and
      # getting that wrong picks a different pixel without ever looking broken.
      - path: Mac/Library/AssetArtwork.swift
      # Whether opening the app interrupts the phone's own audio is decided
      # here, it is plain AVFoundation, and it is invisible from any screenshot,
      # so it is covered here rather than needing an App test target.
      - path: App/AudioSessionPolicy.swift
      # Whether the in-app preview keeps step with the widget is decided by the
      # drift maths here, and the two only disagree after minutes of playing -
      # which is exactly what nobody notices by watching.
      - path: App/LoopingCompositionView.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.MotionaryTests
        # The private-font-embedding shim is compiled in here always, so the unit
        # suite is what notices if WidgetKit's accessors change or disappear. The
        # app and the extension only get it when a measurement run asks, because
        # the symbols are strong and a shipped widget should not depend on them.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), FONT_EMBED_PROBE]
        # Lets the FONT_EMBED_PROBE build still link if a future SDK stops
        # exporting the two private `_wantsCustomFontsEmbeddedInArchive`
        # accessors. It does NOT make a found symbol weak - the reference stays
        # strong and two-level - which is why the shim is behind a compile flag
        # rather than shipped. See Shared/WidgetArchiveFontEmbedding.swift.
        OTHER_LDFLAGS:
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvg"
          - -Xlinker
          - -U
          - -Xlinker
          - "_$s7SwiftUI17EnvironmentValuesV9WidgetKitE34_wantsCustomFontsEmbeddedInArchiveSbvs"

  # A design can only reach the Home Screen by being compiled into the widget
  # extension's bundle, so building one is a toolchain run rather than
  # something the phone can do to itself. This is that run, with a window on
  # it. The pipeline is shared verbatim - none of it was ever iOS-only.
  MotionaryStudio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared/Pipeline
      - Shared/SFNT
      - path: Shared/Model/DesignDocument.swift
      - path: Shared/Model/ClipPlaybackMode.swift
      - path: Shared/Pipeline/ClipProgram.swift
      - path: Shared/Pipeline/ProgramPreviewWriter.swift
      - path: Shared/Storage/DesignStore.swift
      - path: Shared/Model/DeviceGeometry.swift
      - path: Shared/Model/TimerFontSpec.swift
      # The timer reference is what the studio's own preview of the stack runs
      # from, so the knob that ages it has to resolve here too.
      - path: Shared/Diagnostics/WidgetAgeLab.swift
      # Sprite placement travels with the frames the studio writes.
      - path: Shared/Model/FrameRect.swift
      - path: Shared/Model/WidgetFamilyCompatibility.swift
      # One set of scheme tokens for both apps, so the studio's palette and the
      # phone's cannot drift apart.
      - path: Shared/UI/EmberPalette.swift
      # The editor places the same tiles the widget draws, so it shares the
      # tile view, the catalogue, the snapping, and the icon pipeline.
      - path: Shared/Icons/IconAsset.swift
      - path: Shared/Icons/SVGIconRenderer.swift
      - path: Shared/Icons/SVGPathParser.swift
      - path: Shared/Rendering/TileView.swift
      # The picture-built body of a design: the studio draws the same stack the
      # widget does, so a delivered design can be seen before it is sent.
      - path: Shared/Rendering/FrameStackLayer.swift
      - path: Shared/Storage/DesignPackage.swift
      - path: Shared/Storage/DeliveryWire.swift
      - path: Shared/Model/AppCatalog.swift
      - path: Shared/Storage/ImageLoader.swift
      - path: Shared/Model/SnapEngine.swift
      - path: Shared/Model/Readout.swift
      - path: Shared/Rendering/ReadoutView.swift
      - path: Shared/Rendering/CompositionView.swift
      # The animation layer is shared so there is one renderer, not two. The
      # studio does not build runtime-frame designs - the phone does - but it
      # draws the same composition, so it needs the layer and the cycle maths
      # the composition now branches on.
      - path: Shared/Storage/PrebuiltDesign.swift
      - path: Shared/Storage/ActiveDesign.swift
      - path: Shared/Diagnostics/WidgetStatus.swift
      - path: App/IconifyService.swift
      - path: Resources/MotionTemplate-Regular.ttf
        buildPhase: resources
      # The studio is where the edge correction is actually applied, so the
      # calibration it reads has to be in this bundle too, not only the phone's.
      - path: Resources/edge-profile.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.MotionaryStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Mac/Assets.xcassets, picked up with the rest of Mac/. Without a name
        # here the catalog compiles but nothing points at it, and the Dock shows
        # the generic application face.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Runs xcodebuild and devicectl against the project it lives in, which
        # a sandboxed app cannot do.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  # Drives SpringBoard from inside the simulator, so the widget can be found
  # and photographed without posting mouse events onto whatever machine is
  # running the build.
  MotionaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Motionary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.MotionaryUITests
