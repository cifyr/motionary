name: Motionary
options:
  bundleIdPrefix: com.caden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    DEVELOPMENT_TEAM: ZRUFVD5GDT
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Motionary:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.Motionary
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Motionary.entitlements
    dependencies:
      - target: MotionaryWidgetExtension
    scheme:
      testTargets: [MotionaryTests]

  MotionaryWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      # The blink font drives which lane is visible; the shaping template is
      # bundled here too so the extension can be diagnosed on its own.
      - path: Resources
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.Motionary.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/MotionaryWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  MotionaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caden.MotionaryTests
